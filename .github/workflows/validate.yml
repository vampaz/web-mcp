name: validate

on:
  workflow_call:
    inputs:
      cache:
        description: Restore and save the npm and Playwright browser caches.
        type: boolean
        default: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: ${{ inputs.cache && 'npm' || '' }}
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run typecheck:demo
      - run: npm run docs:api:check
      - run: npm run test
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        id: playwright-cache
        if: inputs.cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Use Ubuntu's main package mirror
        run: printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
      - name: Install Playwright browsers and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npm exec playwright -- install --with-deps chromium firefox webkit
      - name: Install Playwright system dependencies for cached browsers
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npm exec playwright -- install-deps chromium firefox webkit
      - name: Prepare trusted TLS on this disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install -y libcap2-bin libnss3-tools openssl
          sudo setcap cap_net_bind_service=+ep "$(readlink -f "$(command -v node)")"
          node --experimental-strip-types scripts/setup-test-tls.ts
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run pack:package
      - run: npm run test:package
      - name: Stop test TLS proxy
        if: always()
        run: npm exec -- vite-local-tls proxy stop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webmcp-kit-package
          path: artifacts/webmcp-kit.*
          if-no-files-found: error
