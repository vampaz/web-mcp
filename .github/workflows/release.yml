name: release

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.targets.outputs.version }}
      npm: ${{ steps.targets.outputs.npm }}
      github-packages: ${{ steps.targets.outputs.github-packages }}
      github-release: ${{ steps.targets.outputs.github-release }}
      pending: ${{ steps.targets.outputs.pending }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: /package.json
          sparse-checkout-cone-mode: false
      - name: Check which release targets already have this version
        id: targets
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r .version package.json)
          # npm expands NODE_AUTH_TOKEN when it reads the file, so the token is not written to disk.
          # shellcheck disable=SC2016
          printf '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > "$RUNNER_TEMP/github-packages.npmrc"
          npm=false
          github_packages=false
          github_release=false
          if npm view "@vampaz/webmcp-kit@$version" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            npm=true
          fi
          if NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/github-packages.npmrc" npm view "@vampaz/webmcp-kit@$version" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            github_packages=true
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            github_release=true
          fi
          pending=true
          if [ "$npm$github_packages$github_release" = truetruetrue ]; then
            pending=false
            echo "::notice::Version $version is already on npm, GitHub Packages, and GitHub releases. Skipping validation and publication."
          fi
          {
            echo "version=$version"
            echo "npm=$npm"
            echo "github-packages=$github_packages"
            echo "github-release=$github_release"
            echo "pending=$pending"
          } >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    if: needs.prepare.outputs.pending == 'true'
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
    with:
      cache: false

  publish:
    needs: [prepare, verify]
    if: needs.prepare.outputs.pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-release
    permissions:
      contents: write
      id-token: write
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: /.nvmrc
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webmcp-kit-package
          path: artifacts
      - name: Verify the tested tarball
        run: |
          echo "$(jq -r .sha256 artifacts/webmcp-kit.json)  artifacts/webmcp-kit.tgz" | sha256sum --check --strict
          test "$(tar -xzOf artifacts/webmcp-kit.tgz package/package.json | jq -r .version)" = "$VERSION"

      - name: Publish to npm
        if: needs.prepare.outputs.npm != 'true'
        run: |
          printf 'registry=https://registry.npmjs.org/\n' > ~/.npmrc
          npm publish ./artifacts/webmcp-kit.tgz --provenance --access public
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Publish to GitHub Packages
        if: needs.prepare.outputs.github-packages != 'true'
        run: |
          printf '@vampaz:registry=https://npm.pkg.github.com\n' > ~/.npmrc
          # npm expands NODE_AUTH_TOKEN when it reads the file, so the token is not written to disk.
          # shellcheck disable=SC2016
          printf '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' >> ~/.npmrc
          npm publish ./artifacts/webmcp-kit.tgz --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release
        if: needs.prepare.outputs.github-release != 'true'
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "@vampaz/webmcp-kit v$VERSION" \
            --generate-notes
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
